  cmake_utilities: 0.*
  idf: '>=5.4'
description: ESP LCD JD9365(MIPI-DSI)
issues: https://github.com/espressif/esp-iot-solution/issues
repository: git://github.com/espressif/esp-iot-solution.git
repository_info:
  commit_sha: bd85f52467353dae3bd5f551054795287b0042a4
  path: components/display/lcd/esp_lcd_jd9365
# `targets: [esp32p4]` was here, as upstream ships it, and it broke the S3 build
# outright: the component manager reads every manifest under components/ before the
# root CMakeLists' `set(COMPONENTS main)` can narrow anything down, and refuses the
# whole build when one of them names a different target. The panel is still P4-only --
# main/CMakeLists.txt adds esp_lcd_jd9365 to the requirements inside the esp32p4
# branch and nowhere else, so an S3 build never compiles it. Restoring this line on a
# vendored copy means master stops building for the S3; see git 02486f4.
url: https://github.com/espressif/esp-iot-solution/tree/master/components/display/lcd/esp_lcd_jd9365
version: 2.0.2
